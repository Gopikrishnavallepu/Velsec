services:
  - type: web
    name: velsec-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt # Can be frankfurt, oregon, ohio, singapore
    envVars:
      - key: PROJECT_NAME
        value: "Velsec API"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
