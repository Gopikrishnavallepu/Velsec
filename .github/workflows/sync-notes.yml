name: Sync Obsidian Notes to DB

on:
  push:
    paths:
      - 'notes-vault/**'
      - 'scripts/sync_notes.py'
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Script
        env:
          VELSEC_API_URL: ${{ secrets.VELSEC_API_URL }}
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: python scripts/sync_notes.py
